<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Playlist</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="background"></div>
    <div class= "player">
        <div class="slider-container">
                <span class="arrow-left"></span>
                <span class="arrow-right"></span>
                <div class="slider" id="slider">
            <ul id="playlist"></ul>
        <div id="trackImage"></div>
        </div>
        </div>

        <h2 id="track-title"></h2>
        <h3 id="trackArtist"></h3>
        <progress id="progress-bar"></progress>
        <div id="buttons" >
            <button id="prev" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=skip_previous"> Prev </button>
            <button id="play">▶️ Play / Pause</button>
            <button id="next">⏭ Suivant</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
