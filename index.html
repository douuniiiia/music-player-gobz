<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Playlist</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Gabriela&family=Rakkas&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
    <div id="background"></div>
    <div id="transparentbackground"></div>

    <div class= "player">
        <div class="slider-container">
                <span class="arrow-left"></span>
                <span class="arrow-right"></span>
                <div class="slider" id="slider">
            <ul id="playlist"></ul>
        <div id="trackImage"></div>
        </div>
        </div>

        <h2 id="track-title"></h2>
        <h3 id="trackArtist"></h3>
        <div id="buttons" >
            <button id="prev"> <img src="/public/Skip Previous Icon.svg" class='svg' alt=""> </button>
            <button id="play"> <img src="/public/Play Arrow Icon.svg" class='svg' alt=""></button>
            <button id="next"><img src="/public/Skip Next Icon.svg" class='svg' alt=""></button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
